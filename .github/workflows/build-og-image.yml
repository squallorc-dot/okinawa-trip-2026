name: Generate Okinawa official OG image
on:
  push:
    paths:
      - scripts/build-og-image.py
      - .github/workflows/build-og-image.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: okinawa-og-image
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer and Traditional Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow
      - name: Render licensed Okinawa scene to 1200x630 JPEG
        run: python scripts/build-og-image.py
      - name: Commit cover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/okinawa-og-2026-v2.jpg
          if ! git diff --cached --quiet; then
            git commit -m "assets: generate official 1200x630 Okinawa social preview JPEG"
            git push origin HEAD:main
          fi
