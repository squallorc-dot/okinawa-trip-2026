name: Responsive visual smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run local static server and browser tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/okinawa-server.log 2>&1 &
          sleep 2
          node scripts/visual-smoke.mjs
      - name: Upload desktop and mobile screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okinawa-responsive-screenshots
          path: artifacts/
          retention-days: 7
