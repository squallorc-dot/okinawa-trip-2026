name: Validate Okinawa travel website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check files and module syntax
        run: |
          set -eu
          test -f index.html
          test -f app.js
          test -f data.js
          test -f styles.css
          test -f sw.js
          test -f travel-tracking.js
          node --check travel-tracking.js
          test -f manifest.webmanifest
          test -f assets/icon.svg
          test -f assets/og-cover.svg
          node --check app.js
          node --check data.js
          node --check sw.js
          node -e "const m=require('./manifest.webmanifest'); if(!m.name||!m.icons?.length)process.exit(1)" 2>/dev/null || node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.webmanifest'));if(!m.name||!m.icons?.length)process.exit(1)"
      - name: Check consistent release token
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const v=JSON.parse(fs.readFileSync('version.json','utf8')).version;
          const tokens=v.replaceAll('.','');
          for (const [file,str] of [['index.html',v.replaceAll('.','')],['sw.js',v],['app.js',v.replaceAll('.','')]]) {
            const s=fs.readFileSync(file,'utf8');
            if(!s.includes(str))throw new Error(file+' missing version '+str);
          }
          for (const s of ['./','./index.html','./app.js','./data.js','./styles.css','./assets/icon.svg','./assets/og-cover.svg','./manifest.webmanifest','./refresh.html']) {
            if (!fs.existsSync(s)) throw new Error('Missing offline resource: '+s);
          }
          const html=fs.readFileSync('index.html','utf8'),sw=fs.readFileSync('sw.js','utf8');
          if(!html.includes('data-trip-id="okinawa_2026"')||!html.includes('data-gtm-id="GTM-5MK7X2XK"'))throw new Error('GTM tracking configuration missing');
          if(!sw.includes("'./travel-tracking.js'"))throw new Error('Analytics offline file is missing');
          const data=fs.readFileSync('data.js','utf8'),app=fs.readFileSync('app.js','utf8'),media=fs.readFileSync('media.js','utf8');
          for (const id of ['p28','p29']) if(!data.includes('id:"'+id+'"')||!media.includes(id+':'))throw new Error('Missing Hikari product '+id);
          if(!data.includes('export const DAY5_PLAN_B') || !app.includes('day5PlanSwitch') || !app.includes('data-plan='))throw new Error('Missing A/B route UI');
          if(!app.includes('save("day5-plan"') || !app.includes('DAY5_PLAN_B.events'))throw new Error('Missing A/B route persistence');
          if(!data.includes('bianco:{name:')||!data.includes('petbox:{name:'))throw new Error('Missing new pet shops');
          if (!data.includes('export const DAY5_PLAN_C') || !data.includes('nishimatsuya:{name:')) throw new Error('Day 5 C plan / Nishimatsuya missing');
          if (!app.includes('DAY5_PLAN_C.events') || !app.includes('C｜三間專門店') || !app.includes('hotel-bianco-c-rail')) throw new Error('Day 5 C switch / travel choices missing');
          if (!data.includes('id:"petbox-nishimatsuya-c"') || !data.includes('id:"nishimatsuya-hotel-c-taxi"')) throw new Error('C route links missing');
          console.log('Version, tracking, A/B/C routes and offline files verified',v);
          JS
