<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1e6673"><title>沖繩手冊更新</title><style>body{margin:0;background:#f7f8f4;color:#203940;font:17px/1.8 system-ui,'Microsoft JhengHei',sans-serif;display:grid;min-height:100vh;place-items:center;padding:25px}main{max-width:480px;background:white;border-radius:25px;padding:35px;box-shadow:0 10px 50px #18403717}h1{color:#1e6673}button{font:inherit;border:0;background:#1e6673;color:white;border-radius:12px;padding:12px 18px;cursor:pointer}</style><main><h1>更新沖繩手冊</h1><p>如果 LINE 或手機仍看到舊版，可清除本網站快取後重新開啟。購物勾選狀態會保留。</p><p id="status">尚未執行更新。</p><button id="refresh">清除舊版並回到網站</button></main><script>document.getElementById('refresh').onclick=async()=>{let x=document.getElementById('status');x.textContent='正在更新…';try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){if(r.scope.includes('/okinawa-trip-2026/'))await r.unregister();}}if('caches' in window){for(const name of await caches.keys()){if(name.startsWith('okinawa-trip-'))await caches.delete(name);}}x.textContent='已清除網站舊版快取，購物紀錄不受影響。';location.replace('./?update='+Date.now());}catch(e){x.textContent='更新未完全成功，請重新整理頁面。';}};</script></html>
